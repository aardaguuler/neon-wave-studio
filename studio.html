<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Wave Studio Pro</title>
  <!-- Google Fonts: Inter ve Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #05070f;
      --panel-bg: rgba(10, 12, 28, 0.7);
      --panel-border: rgba(0, 242, 254, 0.12);
      --neon-blue: #00f2fe;
      --neon-pink: #f355da;
      --neon-purple: #7000ff;
      --neon-green: #39ff14;
      --text-main: #f8fafc;
      --text-muted: #64748b;
      --text-active: #00f2fe;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      overflow-x: hidden;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .studio-container {
      width: 100%;
      max-width: 1100px;
      background: var(--panel-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 
                  0 0 50px rgba(112, 0, 255, 0.04);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Üst Kontrol Paneli */
    .header-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 14px;
    }

    .brand-section h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--neon-blue), var(--neon-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-section p {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .global-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-main {
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(135deg, var(--neon-purple), var(--neon-pink));
      color: white;
      border: none;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 15px rgba(243, 85, 218, 0.25);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-main:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 25px rgba(243, 85, 218, 0.4);
    }

    .btn-main.playing {
      background: linear-gradient(135deg, #00b4db, #00f2fe);
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.25);
    }

    .tempo-slider-container {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .tempo-slider-container label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .tempo-slider {
      -webkit-appearance: none;
      width: 100px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      outline: none;
    }

    .tempo-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--neon-blue);
      cursor: pointer;
      box-shadow: 0 0 6px var(--neon-blue);
      transition: all 0.15s;
    }

    .bpm-display {
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--neon-blue);
      width: 32px;
      text-align: right;
    }

    /* Görselleştirici Canvas */
    .visualizer-card {
      width: 100%;
      height: 60px;
      background: rgba(3, 5, 12, 0.8);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      position: relative;
      overflow: hidden;
    }

    #visualizer {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Ritim Adımlayıcı Bölümü */
    .section-title {
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .section-title span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--neon-pink);
      display: inline-block;
      box-shadow: 0 0 6px var(--neon-pink);
    }

    .sequencer-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(255, 255, 255, 0.01);
      padding: 12px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .sequencer-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Kanal Bilgi / Mikser Alanı (Satır Başı) */
    .channel-mixer {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 200px;
      background: rgba(255, 255, 255, 0.02);
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.02);
    }

    .instrument-label {
      flex-grow: 1;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow: hidden;
      transition: all 0.2s;
    }

    .instrument-label:hover {
      color: var(--text-main);
    }

    /* Kanal Volume Slider */
    .vol-slider {
      -webkit-appearance: none;
      width: 50px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      outline: none;
    }

    .vol-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--neon-blue);
      cursor: pointer;
    }

    /* Mute Butonu */
    .mute-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      font-size: 9px;
      font-weight: 800;
      width: 20px;
      height: 20px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .mute-btn:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
    }

    .mute-btn.muted {
      background: rgba(243, 85, 218, 0.15);
      border-color: var(--neon-pink);
      color: var(--neon-pink);
    }

    /* 16 Adımlı Izgara */
    .step-buttons {
      display: grid;
      grid-template-columns: repeat(16, 1fr);
      gap: 4px;
      flex-grow: 1;
    }

    .step-btn {
      aspect-ratio: 1.1;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.03);
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    /* 4'lük Beat grupları için hafif görsel ayrım */
    .step-buttons .step-btn:nth-child(4n+1) {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.06);
    }

    .step-btn:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .step-btn.active {
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.15), rgba(0, 242, 254, 0.45));
      border-color: var(--neon-blue);
      box-shadow: 0 0 8px rgba(0, 242, 254, 0.25);
    }

    .step-btn.active::after {
      content: '';
      position: absolute;
      top: 3px;
      right: 3px;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--neon-blue);
      box-shadow: 0 0 4px var(--neon-blue);
    }

    .step-btn.current {
      border-color: var(--neon-pink);
      transform: scale(1.08);
      box-shadow: 0 0 10px rgba(243, 85, 218, 0.35);
      z-index: 2;
    }

    /* Piyano ve Efekt Paneli (Çift Sütun Düzeni) */
    .synth-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .panel-card {
      background: rgba(255, 255, 255, 0.01);
      padding: 16px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .piano-keys {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
      height: 110px;
    }

    .piano-key {
      background: linear-gradient(to bottom, #ffffff 75%, #cbd5e1 100%);
      color: #0f172a;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      font-weight: 800;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 8px;
      transition: all 0.1s ease-out;
      box-shadow: 0 4px 0 #94a3b8, 0 6px 10px rgba(0,0,0,0.15);
      position: relative;
    }

    .piano-key:hover {
      background: linear-gradient(to bottom, #f8fafc 75%, #94a3b8 100%);
    }

    .piano-key:active, .piano-key.active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #64748b, 0 2px 4px rgba(0,0,0,0.15);
      background: linear-gradient(to bottom, var(--neon-blue) 0%, #00d2de 100%);
      color: white;
    }

    .piano-key::before {
      content: attr(data-letter);
      position: absolute;
      top: 6px;
      font-size: 9px;
      font-weight: 800;
      color: rgba(0, 0, 0, 0.35);
      background: rgba(0,0,0,0.05);
      padding: 1px 4px;
      border-radius: 3px;
    }

    .piano-key:active::before, .piano-key.active::before {
      color: rgba(255, 255, 255, 0.7);
      background: rgba(255,255,255,0.15);
    }

    /* Efekt Parametreleri Izgarası */
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .control-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: rgba(255, 255, 255, 0.02);
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.02);
    }

    .control-item label {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
    }

    .control-item label span {
      color: var(--neon-blue);
    }

    .control-input {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      outline: none;
    }

    .control-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      outline: none;
      margin: 4px 0;
    }

    .control-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--neon-pink);
      cursor: pointer;
    }

    /* Mobil Uyum */
    @media (max-width: 800px) {
      .synth-panel {
        grid-template-columns: 1fr;
      }
      .channel-mixer {
        width: 130px;
      }
      .vol-slider {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="studio-container">
    
    <!-- Üst Kontrol Paneli -->
    <div class="header-panel">
      <div class="brand-section">
        <h1><span>⚡</span> NEON WAVE STUDIO PRO</h1>
        <p>16-Step Davul Sequencer & Delay Efektli Melodi Sentezleyici</p>
      </div>
      
      <div class="global-controls">
        <div class="tempo-slider-container">
          <label for="tempo">BPM</label>
          <input type="range" id="tempo" class="tempo-slider" min="60" max="180" value="120">
          <span class="bpm-display" id="bpm-val">120</span>
        </div>
        <button class="btn-main" id="play-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          Döngüyü Başlat
        </button>
      </div>
    </div>

    <!-- Canlı Ses Dalga Analizcisi -->
    <div class="visualizer-card">
      <canvas id="visualizer"></canvas>
    </div>

    <!-- Ritim Adımlayıcı (16 Adım Sequencer) -->
    <div>
      <div class="section-title">
        <span></span> 16-Step Ritim Dizici (Drum Sequencer)
      </div>
      <div class="sequencer-grid">
        
        <!-- Kick -->
        <div class="sequencer-row" data-inst="kick">
          <div class="channel-mixer">
            <div class="instrument-label" onclick="triggerPlay('kick')">🔊 Kick (Bas)</div>
            <input type="range" class="vol-slider" min="0" max="1" step="0.1" value="0.8" oninput="changeChannelVol('kick', this.value)">
            <button class="mute-btn" onclick="toggleMute('kick', this)">M</button>
          </div>
          <div class="step-buttons">
            <!-- 16 Adım Butonları -->
            <button class="step-btn" data-step="0"></button><button class="step-btn" data-step="1"></button>
            <button class="step-btn" data-step="2"></button><button class="step-btn" data-step="3"></button>
            <button class="step-btn" data-step="4"></button><button class="step-btn" data-step="5"></button>
            <button class="step-btn" data-step="6"></button><button class="step-btn" data-step="7"></button>
            <button class="step-btn" data-step="8"></button><button class="step-btn" data-step="9"></button>
            <button class="step-btn" data-step="10"></button><button class="step-btn" data-step="11"></button>
            <button class="step-btn" data-step="12"></button><button class="step-btn" data-step="13"></button>
            <button class="step-btn" data-step="14"></button><button class="step-btn" data-step="15"></button>
          </div>
        </div>

        <!-- Snare -->
        <div class="sequencer-row" data-inst="snare">
          <div class="channel-mixer">
            <div class="instrument-label" onclick="triggerPlay('snare')">🥁 Snare (Trampet)</div>
            <input type="range" class="vol-slider" min="0" max="1" step="0.1" value="0.7" oninput="changeChannelVol('snare', this.value)">
            <button class="mute-btn" onclick="toggleMute('snare', this)">M</button>
          </div>
          <div class="step-buttons">
            <button class="step-btn" data-step="0"></button><button class="step-btn" data-step="1"></button>
            <button class="step-btn" data-step="2"></button><button class="step-btn" data-step="3"></button>
            <button class="step-btn" data-step="4"></button><button class="step-btn" data-step="5"></button>
            <button class="step-btn" data-step="6"></button><button class="step-btn" data-step="7"></button>
            <button class="step-btn" data-step="8"></button><button class="step-btn" data-step="9"></button>
            <button class="step-btn" data-step="10"></button><button class="step-btn" data-step="11"></button>
            <button class="step-btn" data-step="12"></button><button class="step-btn" data-step="13"></button>
            <button class="step-btn" data-step="14"></button><button class="step-btn" data-step="15"></button>
          </div>
        </div>

        <!-- HiHat -->
        <div class="sequencer-row" data-inst="hihat">
          <div class="channel-mixer">
            <div class="instrument-label" onclick="triggerPlay('hihat')">✨ Hi-Hat (Zil)</div>
            <input type="range" class="vol-slider" min="0" max="1" step="0.1" value="0.5" oninput="changeChannelVol('hihat', this.value)">
            <button class="mute-btn" onclick="toggleMute('hihat', this)">M</button>
          </div>
          <div class="step-buttons">
            <button class="step-btn" data-step="0"></button><button class="step-btn" data-step="1"></button>
            <button class="step-btn" data-step="2"></button><button class="step-btn" data-step="3"></button>
            <button class="step-btn" data-step="4"></button><button class="step-btn" data-step="5"></button>
            <button class="step-btn" data-step="6"></button><button class="step-btn" data-step="7"></button>
            <button class="step-btn" data-step="8"></button><button class="step-btn" data-step="9"></button>
            <button class="step-btn" data-step="10"></button><button class="step-btn" data-step="11"></button>
            <button class="step-btn" data-step="12"></button><button class="step-btn" data-step="13"></button>
            <button class="step-btn" data-step="14"></button><button class="step-btn" data-step="15"></button>
          </div>
        </div>

        <!-- Clap -->
        <div class="sequencer-row" data-inst="clap">
          <div class="channel-mixer">
            <div class="instrument-label" onclick="triggerPlay('clap')">👏 Clap (Alkış)</div>
            <input type="range" class="vol-slider" min="0" max="1" step="0.1" value="0.6" oninput="changeChannelVol('clap', this.value)">
            <button class="mute-btn" onclick="toggleMute('clap', this)">M</button>
          </div>
          <div class="step-buttons">
            <button class="step-btn" data-step="0"></button><button class="step-btn" data-step="1"></button>
            <button class="step-btn" data-step="2"></button><button class="step-btn" data-step="3"></button>
            <button class="step-btn" data-step="4"></button><button class="step-btn" data-step="5"></button>
            <button class="step-btn" data-step="6"></button><button class="step-btn" data-step="7"></button>
            <button class="step-btn" data-step="8"></button><button class="step-btn" data-step="9"></button>
            <button class="step-btn" data-step="10"></button><button class="step-btn" data-step="11"></button>
            <button class="step-btn" data-step="12"></button><button class="step-btn" data-step="13"></button>
            <button class="step-btn" data-step="14"></button><button class="step-btn" data-step="15"></button>
          </div>
        </div>

        <!-- Tom -->
        <div class="sequencer-row" data-inst="tom">
          <div class="channel-mixer">
            <div class="instrument-label" onclick="triggerPlay('tom')">🍩 Tom (Orta Bas)</div>
            <input type="range" class="vol-slider" min="0" max="1" step="0.1" value="0.7" oninput="changeChannelVol('tom', this.value)">
            <button class="mute-btn" onclick="toggleMute('tom', this)">M</button>
          </div>
          <div class="step-buttons">
            <button class="step-btn" data-step="0"></button><button class="step-btn" data-step="1"></button>
            <button class="step-btn" data-step="2"></button><button class="step-btn" data-step="3"></button>
            <button class="step-btn" data-step="4"></button><button class="step-btn" data-step="5"></button>
            <button class="step-btn" data-step="6"></button><button class="step-btn" data-step="7"></button>
            <button class="step-btn" data-step="8"></button><button class="step-btn" data-step="9"></button>
            <button class="step-btn" data-step="10"></button><button class="step-btn" data-step="11"></button>
            <button class="step-btn" data-step="12"></button><button class="step-btn" data-step="13"></button>
            <button class="step-btn" data-step="14"></button><button class="step-btn" data-step="15"></button>
          </div>
        </div>

        <!-- FX (Cyber Glitch) -->
        <div class="sequencer-row" data-inst="fx">
          <div class="channel-mixer">
            <div class="instrument-label" onclick="triggerPlay('fx')">👽 Synth FX (Glitch)</div>
            <input type="range" class="vol-slider" min="0" max="1" step="0.1" value="0.5" oninput="changeChannelVol('fx', this.value)">
            <button class="mute-btn" onclick="toggleMute('fx', this)">M</button>
          </div>
          <div class="step-buttons">
            <button class="step-btn" data-step="0"></button><button class="step-btn" data-step="1"></button>
            <button class="step-btn" data-step="2"></button><button class="step-btn" data-step="3"></button>
            <button class="step-btn" data-step="4"></button><button class="step-btn" data-step="5"></button>
            <button class="step-btn" data-step="6"></button><button class="step-btn" data-step="7"></button>
            <button class="step-btn" data-step="8"></button><button class="step-btn" data-step="9"></button>
            <button class="step-btn" data-step="10"></button><button class="step-btn" data-step="11"></button>
            <button class="step-btn" data-step="12"></button><button class="step-btn" data-step="13"></button>
            <button class="step-btn" data-step="14"></button><button class="step-btn" data-step="15"></button>
          </div>
        </div>

      </div>
    </div>

    <!-- Piyano & Efekt Paneli (Alt Kısım Çift Sütun) -->
    <div class="synth-panel">
      
      <!-- Sol Sütun: Piyano Klavyesi -->
      <div class="panel-card">
        <div class="section-title" style="margin-bottom:4px;">
          <span style="background:var(--neon-blue); box-shadow: 0 0 6px var(--neon-blue)"></span> Mini Melodi Klavyesi
        </div>
        <div class="piano-keys">
          <button class="piano-key" data-note="261.63" data-letter="A">C4</button>
          <button class="piano-key" data-note="293.66" data-letter="S">D4</button>
          <button class="piano-key" data-note="329.63" data-letter="D">E4</button>
          <button class="piano-key" data-note="349.23" data-letter="F">F4</button>
          <button class="piano-key" data-note="392.00" data-letter="G">G4</button>
          <button class="piano-key" data-note="440.00" data-letter="H">A4</button>
          <button class="piano-key" data-note="493.88" data-letter="J">B4</button>
          <button class="piano-key" data-note="523.25" data-letter="K">C5</button>
        </div>
      </div>

      <!-- Sağ Sütun: Synthesizer Kontrolleri & Delay FX -->
      <div class="panel-card">
        <div class="section-title" style="margin-bottom:4px;">
          <span style="background:var(--neon-pink); box-shadow: 0 0 6px var(--neon-pink)"></span> Synth & Delay FX Ayarları
        </div>
        
        <div class="controls-grid">
          
          <div class="control-item">
            <label>Dalga Şekli</label>
            <select id="waveform" class="control-input">
              <option value="triangle" selected>Triangle (Klasik)</option>
              <option value="sine">Sine (Yumuşak)</option>
              <option value="sawtooth">Sawtooth (Keskin)</option>
              <option value="square">Square (Retro)</option>
            </select>
          </div>

          <div class="control-item">
            <label>Ses Sönme (Decay) <span id="decay-val">0.6s</span></label>
            <input type="range" id="synth-decay" class="control-slider" min="0.1" max="2.0" step="0.1" value="0.6" oninput="document.getElementById('decay-val').innerText = this.value + 's'">
          </div>

          <div class="control-item">
            <label>Filtre Sıklığı <span id="cutoff-val">3000Hz</span></label>
            <input type="range" id="filter" class="control-slider" min="200" max="8000" step="100" value="3000" oninput="document.getElementById('cutoff-val').innerText = this.value + 'Hz'">
          </div>

          <div class="control-item">
            <label>Delay Yankı Gücü <span id="delay-feedback-val">30%</span></label>
            <input type="range" id="delay-feedback" class="control-slider" min="0" max="0.8" step="0.05" value="0.3" oninput="updateDelayFeedback(this.value)">
          </div>

        </div>
      </div>

    </div>

  </div>

  <script>
    // --- SES SENTEZLEME MOTORU (WEB AUDIO API) ---
    let audioCtx = null;
    let mainGainNode = null;
    let analyserNode = null;

    // Delay (Yankı) Efekti Değişkenleri
    let delayNode = null;
    let delayFeedbackNode = null;

    // Her enstrüman kanalı için ayrı ses seviyesi (Volume) kontrolleri
    const channelVolumes = {
      kick: 0.8,
      snare: 0.7,
      hihat: 0.5,
      clap: 0.6,
      tom: 0.7,
      fx: 0.5
    };

    const channelMutes = {
      kick: false,
      snare: false,
      hihat: false,
      clap: false,
      tom: false,
      fx: false
    };

    function initAudio() {
      if (audioCtx) return;
      
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
      
      // Genel çıkış kontrolü
      mainGainNode = audioCtx.createGain();
      mainGainNode.gain.setValueAtTime(0.8, audioCtx.currentTime);
      
      // Dalga görselleştirici analiz düğümü
      analyserNode = audioCtx.createAnalyser();
      analyserNode.fftSize = 256;
      
      // DELAY (YANKI) EFECT NODU BAĞLANTILARI
      delayNode = audioCtx.createDelay(2.0);
      delayFeedbackNode = audioCtx.createGain();
      
      // Delay ayarları
      delayNode.delayTime.setValueAtTime(0.35, audioCtx.currentTime); // 350ms delay
      const initialFeedback = parseFloat(document.getElementById('delay-feedback').value);
      delayFeedbackNode.gain.setValueAtTime(initialFeedback, audioCtx.currentTime);
      
      // Geri besleme loop'u (Feedback Loop)
      delayNode.connect(delayFeedbackNode);
      delayFeedbackNode.connect(delayNode);
      
      // Delay çıkışını ana ses kanalına bağlama
      delayNode.connect(mainGainNode);
      
      // Ana bağlantılar
      mainGainNode.connect(analyserNode);
      analyserNode.connect(audioCtx.destination);
      
      startVisualizer();
    }

    // Mikser Fonksiyonları
    function changeChannelVol(inst, val) {
      channelVolumes[inst] = parseFloat(val);
    }

    function toggleMute(inst, btn) {
      channelMutes[inst] = !channelMutes[inst];
      if (channelMutes[inst]) {
        btn.classList.add('muted');
        btn.innerText = 'S';
      } else {
        btn.classList.remove('muted');
        btn.innerText = 'M';
      }
    }

    function updateDelayFeedback(val) {
      const percentage = Math.round(val * 100) + '%';
      document.getElementById('delay-feedback-val').innerText = percentage;
      if (delayFeedbackNode && audioCtx) {
        delayFeedbackNode.gain.setValueAtTime(parseFloat(val), audioCtx.currentTime);
      }
    }

    // --- ENSTRÜMAN SENTEZLEYİCİLERİ ---

    function getChannelGain(inst, time) {
      const gainNode = audioCtx.createGain();
      const finalVol = channelMutes[inst] ? 0.0 : channelVolumes[inst];
      gainNode.gain.setValueAtTime(finalVol, time);
      return gainNode;
    }

    // 1. KICK
    function playKick(time) {
      if (!audioCtx) initAudio();
      
      const osc = audioCtx.createOscillator();
      const channelGain = getChannelGain('kick', time);
      const voiceGain = audioCtx.createGain();
      
      osc.connect(voiceGain);
      voiceGain.connect(channelGain);
      channelGain.connect(mainGainNode);
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(140, time);
      osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.28);
      
      voiceGain.gain.setValueAtTime(1.0, time);
      voiceGain.gain.exponentialRampToValueAtTime(0.001, time + 0.28);
      
      osc.start(time);
      osc.stop(time + 0.3);
    }

    // Gürültü Üretici (White Noise Buffer)
    let noiseBufferCache = null;
    function getNoiseBuffer() {
      if (noiseBufferCache) return noiseBufferCache;
      
      const bufferSize = audioCtx.sampleRate * 0.5;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      noiseBufferCache = buffer;
      return buffer;
    }

    // 2. SNARE
    function playSnare(time) {
      if (!audioCtx) initAudio();
      
      const noiseSource = audioCtx.createBufferSource();
      noiseSource.buffer = getNoiseBuffer();
      
      const noiseFilter = audioCtx.createBiquadFilter();
      noiseFilter.type = 'bandpass';
      noiseFilter.frequency.setValueAtTime(1200, time);
      
      const voiceGain = audioCtx.createGain();
      voiceGain.gain.setValueAtTime(0.6, time);
      voiceGain.gain.exponentialRampToValueAtTime(0.01, time + 0.18);
      
      const channelGain = getChannelGain('snare', time);
      
      noiseSource.connect(noiseFilter);
      noiseFilter.connect(voiceGain);
      voiceGain.connect(channelGain);
      channelGain.connect(mainGainNode);
      
      // Vuruş gövdesi tonu
      const osc = audioCtx.createOscillator();
      const oscGain = audioCtx.createGain();
      
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(170, time);
      osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.08);
      
      oscGain.gain.setValueAtTime(0.7, time);
      oscGain.gain.exponentialRampToValueAtTime(0.01, time + 0.08);
      
      osc.connect(oscGain);
      oscGain.connect(channelGain);
      
      noiseSource.start(time);
      noiseSource.stop(time + 0.2);
      
      osc.start(time);
      osc.stop(time + 0.1);
    }

    // 3. HI-HAT
    function playHihat(time) {
      if (!audioCtx) initAudio();
      
      const source = audioCtx.createBufferSource();
      source.buffer = getNoiseBuffer();
      
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.setValueAtTime(8000, time);
      
      const voiceGain = audioCtx.createGain();
      voiceGain.gain.setValueAtTime(0.25, time);
      voiceGain.gain.exponentialRampToValueAtTime(0.001, time + 0.04);
      
      const channelGain = getChannelGain('hihat', time);
      
      source.connect(filter);
      filter.connect(voiceGain);
      voiceGain.connect(channelGain);
      channelGain.connect(mainGainNode);
      
      source.start(time);
      source.stop(time + 0.05);
    }

    // 4. CLAP
    function playClap(time) {
      if (!audioCtx) initAudio();
      
      const source = audioCtx.createBufferSource();
      source.buffer = getNoiseBuffer();
      
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1300, time);
      
      const voiceGain = audioCtx.createGain();
      voiceGain.gain.setValueAtTime(0.5, time);
      voiceGain.gain.exponentialRampToValueAtTime(0.01, time + 0.02);
      voiceGain.gain.setValueAtTime(0.4, time + 0.025);
      voiceGain.gain.exponentialRampToValueAtTime(0.01, time + 0.045);
      voiceGain.gain.setValueAtTime(0.6, time + 0.05);
      voiceGain.gain.exponentialRampToValueAtTime(0.001, time + 0.16);
      
      const channelGain = getChannelGain('clap', time);
      
      source.connect(filter);
      filter.connect(voiceGain);
      voiceGain.connect(channelGain);
      channelGain.connect(mainGainNode);
      
      source.start(time);
      source.stop(time + 0.2);
    }

    // 5. TOM (Medium Tom)
    function playTom(time) {
      if (!audioCtx) initAudio();
      
      const osc = audioCtx.createOscillator();
      const voiceGain = audioCtx.createGain();
      const channelGain = getChannelGain('tom', time);
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(110, time);
      osc.frequency.exponentialRampToValueAtTime(45, time + 0.22);
      
      voiceGain.gain.setValueAtTime(0.9, time);
      voiceGain.gain.exponentialRampToValueAtTime(0.001, time + 0.22);
      
      osc.connect(voiceGain);
      voiceGain.connect(channelGain);
      channelGain.connect(mainGainNode);
      
      osc.start(time);
      osc.stop(time + 0.25);
    }

    // 6. SYNTH FX (Glitch / Modulated Sound)
    function playFX(time) {
      if (!audioCtx) initAudio();
      
      const osc = audioCtx.createOscillator();
      const voiceGain = audioCtx.createGain();
      const channelGain = getChannelGain('fx', time);
      
      osc.type = 'sawtooth';
      // Hızlı frekans kayması
      osc.frequency.setValueAtTime(800, time);
      osc.frequency.exponentialRampToValueAtTime(80, time + 0.12);
      
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(600, time);
      filter.Q.setValueAtTime(8, time);
      
      voiceGain.gain.setValueAtTime(0.5, time);
      voiceGain.gain.exponentialRampToValueAtTime(0.001, time + 0.12);
      
      osc.connect(filter);
      filter.connect(voiceGain);
      voiceGain.connect(channelGain);
      channelGain.connect(mainGainNode);
      
      osc.start(time);
      osc.stop(time + 0.15);
    }

    // Synthesizer Notalarını Çalma Fonksiyonu (Filtre + Delay Desteği)
    function playSynthNote(freq) {
      if (!audioCtx) initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const voiceGain = audioCtx.createGain();
      const filterNode = audioCtx.createBiquadFilter();

      const type = document.getElementById('waveform').value;
      const filterFreq = parseFloat(document.getElementById('filter').value);
      const decayTime = parseFloat(document.getElementById('synth-decay').value);

      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

      // Lowpass Filtresi
      filterNode.type = 'lowpass';
      filterNode.frequency.setValueAtTime(filterFreq, audioCtx.currentTime);
      filterNode.Q.setValueAtTime(2.0, audioCtx.currentTime); // Parlaklığı artırmak için Q ekliyoruz
      filterNode.frequency.exponentialRampToValueAtTime(filterFreq * 0.3, audioCtx.currentTime + decayTime);

      // Ses Seviyesi Envelope
      voiceGain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      voiceGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + decayTime);

      // Bağlantılar: Ses -> Filtre -> Gain
      osc.connect(filterNode);
      filterNode.connect(voiceGain);
      
      // Yarı kuru (Direct Main), Yarı ıslak (Delay Node) bağlantı
      voiceGain.connect(mainGainNode); // Kuru ses
      voiceGain.connect(delayNode);    // Islak yankılı ses (Delay kanalına)

      osc.start();
      osc.stop(audioCtx.currentTime + decayTime + 0.1);
    }

    // Ped Manuel Tetikleyici
    function triggerPlay(inst) {
      if (!audioCtx) initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const now = audioCtx.currentTime;
      if (inst === 'kick') playKick(now);
      else if (inst === 'snare') playSnare(now);
      else if (inst === 'hihat') playHihat(now);
      else if (inst === 'clap') playClap(now);
      else if (inst === 'tom') playTom(now);
      else if (inst === 'fx') playFX(now);
    }

    // --- 16 ADIMLI SEQUENCER MANTIĞI ---
    let isPlaying = false;
    let currentStep = 0;
    let tempo = 120;
    let timerId = null;
    let nextNoteTime = 0.0;
    const scheduleAheadTime = 0.1;
    const lookahead = 25.0;

    function nextStep() {
      const secondsPerBeat = 60.0 / tempo;
      const stepDuration = secondsPerBeat / 4; // 16'lık adımlara bölme (Beat başına 4 adım)
      nextNoteTime += stepDuration;
      
      currentStep = (currentStep + 1) % 16;
    }

    function scheduleNote(stepNum, time) {
      const rows = document.querySelectorAll('.sequencer-row');
      rows.forEach(row => {
        const inst = row.getAttribute('data-inst');
        const stepBtn = row.querySelector(`[data-step="${stepNum}"]`);
        
        if (stepBtn && stepBtn.classList.contains('active')) {
          if (inst === 'kick') playKick(time);
          if (inst === 'snare') playSnare(time);
          if (inst === 'hihat') playHihat(time);
          if (inst === 'clap') playClap(time);
          if (inst === 'tom') playTom(time);
          if (inst === 'fx') playFX(time);
        }
      });

      // Görsel olarak mevcut adımı takip etme
      setTimeout(() => {
        const allBtns = document.querySelectorAll('.step-btn');
        allBtns.forEach(btn => btn.classList.remove('current'));
        
        const activeStepBtns = document.querySelectorAll(`[data-step="${stepNum}"]`);
        activeStepBtns.forEach(btn => btn.classList.add('current'));
      }, (time - audioCtx.currentTime) * 1000);
    }

    function scheduler() {
      while (nextNoteTime < audioCtx.currentTime + scheduleAheadTime) {
        scheduleNote(currentStep, nextNoteTime);
        nextStep();
      }
      timerId = setTimeout(scheduler, lookahead);
    }

    function startSequencer() {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      isPlaying = true;
      currentStep = 0;
      nextNoteTime = audioCtx.currentTime + 0.05;
      
      document.getElementById('play-btn').innerHTML = `
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        Döngüyü Durdur
      `;
      document.getElementById('play-btn').classList.add('playing');
      
      scheduler();
    }

    function stopSequencer() {
      isPlaying = false;
      clearTimeout(timerId);
      
      document.getElementById('play-btn').innerHTML = `
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        Döngüyü Başlat
      `;
      document.getElementById('play-btn').classList.remove('playing');
      
      const allBtns = document.querySelectorAll('.step-btn');
      allBtns.forEach(btn => btn.classList.remove('current'));
    }

    // --- ETKİLEŞİM & OLAY YÖNETİCİLERİ ---

    document.getElementById('play-btn').addEventListener('click', () => {
      if (isPlaying) stopSequencer();
      else startSequencer();
    });

    const tempoSlider = document.getElementById('tempo');
    const bpmVal = document.getElementById('bpm-val');
    tempoSlider.addEventListener('input', (e) => {
      tempo = parseInt(e.target.value);
      bpmVal.innerText = tempo;
    });

    const stepBtns = document.querySelectorAll('.step-btn');
    stepBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        btn.classList.toggle('active');
        if (btn.classList.contains('active')) {
          const inst = btn.closest('.sequencer-row').getAttribute('data-inst');
          triggerPlay(inst);
        }
      });
    });

    // Piyano Tuşları
    const pianoKeys = document.querySelectorAll('.piano-key');
    pianoKeys.forEach(key => {
      key.addEventListener('mousedown', () => {
        const freq = parseFloat(key.getAttribute('data-note'));
        playSynthNote(freq);
        key.classList.add('active');
      });
      key.addEventListener('mouseup', () => key.classList.remove('active'));
      key.addEventListener('mouseleave', () => key.classList.remove('active'));
      
      key.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const freq = parseFloat(key.getAttribute('data-note'));
        playSynthNote(freq);
        key.classList.add('active');
      });
      key.addEventListener('touchend', () => key.classList.remove('active'));
    });

    const keyMap = {
      'a': pianoKeys[0], 'A': pianoKeys[0],
      's': pianoKeys[1], 'S': pianoKeys[1],
      'd': pianoKeys[2], 'D': pianoKeys[2],
      'f': pianoKeys[3], 'F': pianoKeys[3],
      'g': pianoKeys[4], 'G': pianoKeys[4],
      'h': pianoKeys[5], 'H': pianoKeys[5],
      'j': pianoKeys[6], 'J': pianoKeys[6],
      'k': pianoKeys[7], 'K': pianoKeys[7]
    };

    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      const keyBtn = keyMap[e.key];
      if (keyBtn) {
        const freq = parseFloat(keyBtn.getAttribute('data-note'));
        playSynthNote(freq);
        keyBtn.classList.add('active');
      }
    });

    window.addEventListener('keyup', (e) => {
      const keyBtn = keyMap[e.key];
      if (keyBtn) keyBtn.classList.remove('active');
    });

    // --- SES GÖRSELLEŞTİRİCİ ---
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth * window.devicePixelRatio;
      canvas.height = canvas.parentElement.clientHeight * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function startVisualizer() {
      const bufferLength = analyserNode.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      
      function draw() {
        requestAnimationFrame(draw);
        
        const width = canvas.width / window.devicePixelRatio;
        const height = canvas.height / window.devicePixelRatio;
        
        analyserNode.getByteTimeDomainData(dataArray);
        
        ctx.fillStyle = 'rgba(5, 7, 15, 0.25)';
        ctx.fillRect(0, 0, width, height);
        
        ctx.lineWidth = 2.5;
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#00f2fe';
        
        const grad = ctx.createLinearGradient(0, 0, width, 0);
        grad.addColorStop(0, '#00f2fe');
        grad.addColorStop(0.5, '#7000ff');
        grad.addColorStop(1, '#f355da');
        ctx.strokeStyle = grad;
        
        ctx.beginPath();
        const sliceWidth = width / bufferLength;
        let x = 0;
        
        for (let i = 0; i < bufferLength; i++) {
          const v = dataArray[i] / 128.0;
          const y = (v * height) / 2;
          
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
          
          x += sliceWidth;
        }
        
        ctx.lineTo(width, height / 2);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }
      
      draw();
    }

    function drawStaticWave() {
      const width = canvas.width / window.devicePixelRatio;
      const height = canvas.height / window.devicePixelRatio;
      ctx.fillStyle = '#05070f';
      ctx.fillRect(0, 0, width, height);
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(0, 242, 254, 0.15)';
      ctx.beginPath();
      ctx.moveTo(0, height / 2);
      ctx.lineTo(width, height / 2);
      ctx.stroke();
    }
    drawStaticWave();
  </script>
</body>
