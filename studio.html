<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Wave Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #06080e;
      --surface: rgba(255, 255, 255, 0.025);
      --surface-hover: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.06);
      --border-focus: rgba(255, 255, 255, 0.15);
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.25);
      --accent-alt: #8b5cf6;
      --danger: #ef4444;
      --success: #22c55e;
      --text: #e2e8f0;
      --text-dim: #64748b;
      --text-faint: #334155;
      --step-active-bg: rgba(59, 130, 246, 0.2);
      --step-active-border: rgba(59, 130, 246, 0.5);
      --playhead: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .studio {
      width: 100%;
      max-width: 1080px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: linear-gradient(135deg, var(--accent), var(--accent-alt));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      color: white;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    .header-sub {
      font-size: 11px;
      color: var(--text-dim);
      font-weight: 500;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-help {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-help:hover {
      color: var(--text);
      border-color: var(--border-focus);
      background: var(--surface);
    }

    .tempo-control {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .tempo-control label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
    }

    .tempo-slider {
      -webkit-appearance: none;
      width: 80px;
      height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      outline: none;
    }

    .tempo-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    .bpm-val {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      min-width: 26px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .btn-play {
      background: var(--accent);
      color: white;
      border: none;
      padding: 7px 18px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-play:hover {
      filter: brightness(1.15);
    }

    .btn-play.playing {
      background: var(--danger);
    }

    .btn-play svg { width: 12px; height: 12px; }

    /* ── Visualizer ── */
    .viz-wrap {
      width: 100%;
      height: 48px;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    #visualizer { width: 100%; height: 100%; display: block; }

    /* ── Sequencer ── */
    .seq-section {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .seq-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-faint);
      padding-left: 2px;
    }

    .seq-grid {
      background: var(--surface);
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .seq-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ch-info {
      display: flex;
      align-items: center;
      gap: 4px;
      width: 170px;
      flex-shrink: 0;
    }

    .ch-name {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      cursor: pointer;
      width: 72px;
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow: hidden;
      transition: color 0.15s;
    }

    .ch-name:hover { color: var(--text); }

    .ch-vol {
      -webkit-appearance: none;
      width: 44px;
      height: 2px;
      background: rgba(255,255,255,0.08);
      border-radius: 1px;
      outline: none;
    }

    .ch-vol::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-dim);
      cursor: pointer;
    }

    .ch-mute {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-faint);
      font-size: 9px;
      font-weight: 800;
      width: 18px;
      height: 18px;
      border-radius: 3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .ch-mute:hover { color: var(--text-dim); border-color: var(--border-focus); }

    .ch-mute.muted {
      background: rgba(239, 68, 68, 0.12);
      border-color: var(--danger);
      color: var(--danger);
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(16, 1fr);
      gap: 3px;
      flex-grow: 1;
    }

    .step {
      aspect-ratio: 1.2;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.03);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.12s;
      position: relative;
    }

    /* Beat grouping: subtle brightness on downbeats */
    .steps .step:nth-child(4n+1) {
      background: rgba(255,255,255,0.045);
    }

    .step:hover { background: rgba(255,255,255,0.06); }

    .step.active {
      background: var(--step-active-bg);
      border-color: var(--step-active-border);
    }

    .step.current {
      border-color: var(--playhead);
      box-shadow: inset 0 0 0 1px var(--playhead);
    }

    /* ── Synth Panel ── */
    .synth-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .card {
      background: var(--surface);
      padding: 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-faint);
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 3px;
      height: 100px;
    }

    .key {
      background: linear-gradient(to bottom, #f8fafc 70%, #cbd5e1);
      color: #1e293b;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 10px;
      font-weight: 800;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 7px;
      transition: all 0.08s ease-out;
      box-shadow: 0 3px 0 #94a3b8, 0 4px 8px rgba(0,0,0,0.12);
      position: relative;
    }

    .key::before {
      content: attr(data-letter);
      position: absolute;
      top: 5px;
      font-size: 8px;
      font-weight: 700;
      color: rgba(0,0,0,0.25);
      background: rgba(0,0,0,0.04);
      padding: 1px 4px;
      border-radius: 2px;
    }

    .key:hover { background: linear-gradient(to bottom, #f1f5f9 70%, #94a3b8); }

    .key:active, .key.active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #64748b;
      background: linear-gradient(to bottom, var(--accent), #2563eb);
      color: white;
    }

    .key:active::before, .key.active::before {
      color: rgba(255,255,255,0.6);
      background: rgba(255,255,255,0.12);
    }

    /* ── FX Controls ── */
    .fx-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .fx-item {
      display: flex;
      flex-direction: column;
      gap: 3px;
      background: rgba(255,255,255,0.015);
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.02);
    }

    .fx-item label {
      font-size: 9px;
      font-weight: 700;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.3px;
      display: flex;
      justify-content: space-between;
    }

    .fx-item label span { color: var(--text-dim); font-variant-numeric: tabular-nums; }

    .fx-select {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.06);
      color: var(--text);
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      outline: none;
    }

    .fx-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 2px;
      background: rgba(255,255,255,0.06);
      border-radius: 1px;
      outline: none;
      margin: 3px 0;
    }

    .fx-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent-alt);
      cursor: pointer;
    }

    /* ── Tutorial Overlay ── */
    .tut-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(2px);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .tut-box {
      background: #0c0f1a;
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 12px;
      padding: 18px 20px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: center;
      pointer-events: auto;
      position: absolute;
      bottom: 20px;
      animation: slideUp 0.25s ease-out;
    }

    @keyframes slideUp {
      0% { transform: translateY(16px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    .tut-box h3 {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.2px;
    }

    .tut-box p {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.55;
    }

    .tut-badge {
      display: inline-block;
      background: rgba(59,130,246,0.1);
      border: 1px solid rgba(59,130,246,0.25);
      color: var(--accent);
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 2px auto;
    }

    .tut-badge.done {
      background: rgba(34,197,94,0.1);
      border-color: rgba(34,197,94,0.25);
      color: var(--success);
    }

    .tut-hint {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      padding: 8px;
      border-radius: 6px;
      font-size: 11px;
      color: var(--text-dim);
    }

    .tut-btns {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 2px;
    }

    .tut-skip {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 6px 14px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .tut-skip:hover { color: var(--text); border-color: var(--border-focus); }

    .tut-next {
      background: var(--accent);
      color: white;
      border: none;
      padding: 6px 16px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      flex-grow: 1;
      transition: all 0.15s;
    }

    .tut-next:hover { filter: brightness(1.1); }
    .tut-next:disabled { background: #1e293b; color: #475569; cursor: not-allowed; }

    .tut-highlight {
      position: relative;
      z-index: 10000 !important;
      box-shadow: 0 0 0 2px var(--accent), 0 0 16px var(--accent-glow) !important;
      pointer-events: auto !important;
    }

    @media (max-width: 800px) {
      .synth-row { grid-template-columns: 1fr; }
      .ch-info { width: 110px; }
      .ch-vol { display: none; }
      .key::before { display: none; }
    }
  </style>
</head>
<body>

<div class="studio">

  <!-- Header -->
  <div class="header" id="tut-header">
    <div class="header-left">
      <div class="logo">N</div>
      <div>
        <div class="header-title">Neon Wave Studio</div>
        <div class="header-sub">16-Step Sequencer &middot; Synth &middot; Delay FX</div>
      </div>
    </div>
    <div class="header-controls">
      <button class="btn-help" onclick="startTutorial(true)">Guide</button>
      <div class="tempo-control">
        <label for="tempo">BPM</label>
        <input type="range" id="tempo" class="tempo-slider" min="60" max="180" value="120">
        <span class="bpm-val" id="bpm-val">120</span>
      </div>
      <button class="btn-play" id="play-btn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        Play
      </button>
    </div>
  </div>

  <!-- Visualizer -->
  <div class="viz-wrap">
    <canvas id="visualizer"></canvas>
  </div>

  <!-- Sequencer -->
  <div class="seq-section" id="tut-sequencer">
    <div class="seq-label">Drum Sequencer</div>
    <div class="seq-grid">

      <div class="seq-row" data-inst="kick">
        <div class="ch-info" id="tut-mixer-kick">
          <div class="ch-name" onclick="triggerPlay('kick')">Kick</div>
          <input type="range" class="ch-vol" min="0" max="1" step="0.1" value="0.8" oninput="changeChannelVol('kick',this.value)">
          <button class="ch-mute" onclick="toggleMute('kick',this)">M</button>
        </div>
        <div class="steps">
          <button class="step" data-step="0"></button><button class="step" data-step="1"></button>
          <button class="step" data-step="2"></button><button class="step" data-step="3"></button>
          <button class="step" data-step="4"></button><button class="step" data-step="5"></button>
          <button class="step" data-step="6"></button><button class="step" data-step="7"></button>
          <button class="step" data-step="8"></button><button class="step" data-step="9"></button>
          <button class="step" data-step="10"></button><button class="step" data-step="11"></button>
          <button class="step" data-step="12"></button><button class="step" data-step="13"></button>
          <button class="step" data-step="14"></button><button class="step" data-step="15"></button>
        </div>
      </div>

      <div class="seq-row" data-inst="snare">
        <div class="ch-info">
          <div class="ch-name" onclick="triggerPlay('snare')">Snare</div>
          <input type="range" class="ch-vol" min="0" max="1" step="0.1" value="0.7" oninput="changeChannelVol('snare',this.value)">
          <button class="ch-mute" onclick="toggleMute('snare',this)">M</button>
        </div>
        <div class="steps">
          <button class="step" data-step="0"></button><button class="step" data-step="1"></button>
          <button class="step" data-step="2"></button><button class="step" data-step="3"></button>
          <button class="step" data-step="4"></button><button class="step" data-step="5"></button>
          <button class="step" data-step="6"></button><button class="step" data-step="7"></button>
          <button class="step" data-step="8"></button><button class="step" data-step="9"></button>
          <button class="step" data-step="10"></button><button class="step" data-step="11"></button>
          <button class="step" data-step="12"></button><button class="step" data-step="13"></button>
          <button class="step" data-step="14"></button><button class="step" data-step="15"></button>
        </div>
      </div>

      <div class="seq-row" data-inst="hihat">
        <div class="ch-info">
          <div class="ch-name" onclick="triggerPlay('hihat')">Hi-Hat</div>
          <input type="range" class="ch-vol" min="0" max="1" step="0.1" value="0.5" oninput="changeChannelVol('hihat',this.value)">
          <button class="ch-mute" onclick="toggleMute('hihat',this)">M</button>
        </div>
        <div class="steps">
          <button class="step" data-step="0"></button><button class="step" data-step="1"></button>
          <button class="step" data-step="2"></button><button class="step" data-step="3"></button>
          <button class="step" data-step="4"></button><button class="step" data-step="5"></button>
          <button class="step" data-step="6"></button><button class="step" data-step="7"></button>
          <button class="step" data-step="8"></button><button class="step" data-step="9"></button>
          <button class="step" data-step="10"></button><button class="step" data-step="11"></button>
          <button class="step" data-step="12"></button><button class="step" data-step="13"></button>
          <button class="step" data-step="14"></button><button class="step" data-step="15"></button>
        </div>
      </div>

      <div class="seq-row" data-inst="clap">
        <div class="ch-info">
          <div class="ch-name" onclick="triggerPlay('clap')">Clap</div>
          <input type="range" class="ch-vol" min="0" max="1" step="0.1" value="0.6" oninput="changeChannelVol('clap',this.value)">
          <button class="ch-mute" onclick="toggleMute('clap',this)">M</button>
        </div>
        <div class="steps">
          <button class="step" data-step="0"></button><button class="step" data-step="1"></button>
          <button class="step" data-step="2"></button><button class="step" data-step="3"></button>
          <button class="step" data-step="4"></button><button class="step" data-step="5"></button>
          <button class="step" data-step="6"></button><button class="step" data-step="7"></button>
          <button class="step" data-step="8"></button><button class="step" data-step="9"></button>
          <button class="step" data-step="10"></button><button class="step" data-step="11"></button>
          <button class="step" data-step="12"></button><button class="step" data-step="13"></button>
          <button class="step" data-step="14"></button><button class="step" data-step="15"></button>
        </div>
      </div>

      <div class="seq-row" data-inst="tom">
        <div class="ch-info">
          <div class="ch-name" onclick="triggerPlay('tom')">Tom</div>
          <input type="range" class="ch-vol" min="0" max="1" step="0.1" value="0.7" oninput="changeChannelVol('tom',this.value)">
          <button class="ch-mute" onclick="toggleMute('tom',this)">M</button>
        </div>
        <div class="steps">
          <button class="step" data-step="0"></button><button class="step" data-step="1"></button>
          <button class="step" data-step="2"></button><button class="step" data-step="3"></button>
          <button class="step" data-step="4"></button><button class="step" data-step="5"></button>
          <button class="step" data-step="6"></button><button class="step" data-step="7"></button>
          <button class="step" data-step="8"></button><button class="step" data-step="9"></button>
          <button class="step" data-step="10"></button><button class="step" data-step="11"></button>
          <button class="step" data-step="12"></button><button class="step" data-step="13"></button>
          <button class="step" data-step="14"></button><button class="step" data-step="15"></button>
        </div>
      </div>

      <div class="seq-row" data-inst="fx">
        <div class="ch-info">
          <div class="ch-name" onclick="triggerPlay('fx')">Synth FX</div>
          <input type="range" class="ch-vol" min="0" max="1" step="0.1" value="0.5" oninput="changeChannelVol('fx',this.value)">
          <button class="ch-mute" onclick="toggleMute('fx',this)">M</button>
        </div>
        <div class="steps">
          <button class="step" data-step="0"></button><button class="step" data-step="1"></button>
          <button class="step" data-step="2"></button><button class="step" data-step="3"></button>
          <button class="step" data-step="4"></button><button class="step" data-step="5"></button>
          <button class="step" data-step="6"></button><button class="step" data-step="7"></button>
          <button class="step" data-step="8"></button><button class="step" data-step="9"></button>
          <button class="step" data-step="10"></button><button class="step" data-step="11"></button>
          <button class="step" data-step="12"></button><button class="step" data-step="13"></button>
          <button class="step" data-step="14"></button><button class="step" data-step="15"></button>
        </div>
      </div>

    </div>
  </div>

  <!-- Synth + FX -->
  <div class="synth-row" id="tut-synth">
    <div class="card" id="tut-piano">
      <div class="card-label">Keyboard</div>
      <div class="keys">
        <button class="key" data-note="261.63" data-letter="A">C4</button>
        <button class="key" data-note="293.66" data-letter="S">D4</button>
        <button class="key" data-note="329.63" data-letter="D">E4</button>
        <button class="key" data-note="349.23" data-letter="F">F4</button>
        <button class="key" data-note="392.00" data-letter="G">G4</button>
        <button class="key" data-note="440.00" data-letter="H">A4</button>
        <button class="key" data-note="493.88" data-letter="J">B4</button>
        <button class="key" data-note="523.25" data-letter="K">C5</button>
      </div>
    </div>

    <div class="card" id="tut-effects">
      <div class="card-label">Synth &amp; FX</div>
      <div class="fx-grid">
        <div class="fx-item">
          <label>Waveform</label>
          <select id="waveform" class="fx-select">
            <option value="triangle" selected>Triangle</option>
            <option value="sine">Sine</option>
            <option value="sawtooth">Sawtooth</option>
            <option value="square">Square</option>
          </select>
        </div>
        <div class="fx-item">
          <label>Decay <span id="decay-val">0.6s</span></label>
          <input type="range" id="synth-decay" class="fx-slider" min="0.1" max="2.0" step="0.1" value="0.6" oninput="document.getElementById('decay-val').innerText=this.value+'s'">
        </div>
        <div class="fx-item">
          <label>Cutoff <span id="cutoff-val">3000</span></label>
          <input type="range" id="filter" class="fx-slider" min="200" max="8000" step="100" value="3000" oninput="document.getElementById('cutoff-val').innerText=this.value">
        </div>
        <div class="fx-item">
          <label>Delay <span id="delay-feedback-val">30%</span></label>
          <input type="range" id="delay-feedback" class="fx-slider" min="0" max="0.8" step="0.05" value="0.3" oninput="updateDelayFeedback(this.value)">
        </div>
      </div>
    </div>
  </div>

</div>

<!-- Tutorial -->
<div class="tut-overlay" id="tutorial-overlay">
  <div class="tut-box">
    <h3 id="tut-title"></h3>
    <div class="tut-badge" id="tut-badge"></div>
    <p id="tut-text"></p>
    <div class="tut-hint" id="tut-desc"></div>
    <div class="tut-btns">
      <button class="tut-skip" id="tut-btn-skip">Skip</button>
      <button class="tut-next" id="tut-btn-next" disabled>Next</button>
    </div>
  </div>
</div>

<script>
// ── Audio Engine ──
let audioCtx=null, mainGainNode=null, analyserNode=null, delayNode=null, delayFeedbackNode=null;

const channelVolumes = { kick:0.8, snare:0.7, hihat:0.5, clap:0.6, tom:0.7, fx:0.5 };
const channelMutes = { kick:false, snare:false, hihat:false, clap:false, tom:false, fx:false };

function initAudio(){
  if(audioCtx) return;
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  mainGainNode = audioCtx.createGain();
  mainGainNode.gain.setValueAtTime(0.8, audioCtx.currentTime);
  analyserNode = audioCtx.createAnalyser();
  analyserNode.fftSize = 256;
  delayNode = audioCtx.createDelay(2.0);
  delayFeedbackNode = audioCtx.createGain();
  delayNode.delayTime.setValueAtTime(0.35, audioCtx.currentTime);
  delayFeedbackNode.gain.setValueAtTime(parseFloat(document.getElementById('delay-feedback').value), audioCtx.currentTime);
  delayNode.connect(delayFeedbackNode);
  delayFeedbackNode.connect(delayNode);
  delayNode.connect(mainGainNode);
  mainGainNode.connect(analyserNode);
  analyserNode.connect(audioCtx.destination);
  startVisualizer();
}

function changeChannelVol(i,v){ channelVolumes[i]=parseFloat(v); if(currentTutStep===3) completeTutorialStep(); }
function toggleMute(i,b){
  channelMutes[i]=!channelMutes[i];
  b.classList.toggle('muted', channelMutes[i]);
  b.innerText = channelMutes[i] ? 'S' : 'M';
  if(currentTutStep===3) completeTutorialStep();
}
function updateDelayFeedback(v){
  document.getElementById('delay-feedback-val').innerText=Math.round(v*100)+'%';
  if(delayFeedbackNode&&audioCtx) delayFeedbackNode.gain.setValueAtTime(parseFloat(v), audioCtx.currentTime);
}

function getChGain(inst,t){ const g=audioCtx.createGain(); g.gain.setValueAtTime(channelMutes[inst]?0:channelVolumes[inst],t); return g; }

let noiseCache=null;
function noiseBuf(){ if(noiseCache) return noiseCache; const s=audioCtx.sampleRate*0.5, b=audioCtx.createBuffer(1,s,audioCtx.sampleRate), d=b.getChannelData(0); for(let i=0;i<s;i++) d[i]=Math.random()*2-1; noiseCache=b; return b; }

function playKick(t){ if(!audioCtx) initAudio(); const o=audioCtx.createOscillator(),g=audioCtx.createGain(),c=getChGain('kick',t); o.connect(g); g.connect(c); c.connect(mainGainNode); o.type='sine'; o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(0.01,t+0.28); g.gain.setValueAtTime(1,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.28); o.start(t); o.stop(t+0.3); }

function playSnare(t){ if(!audioCtx) initAudio(); const n=audioCtx.createBufferSource(); n.buffer=noiseBuf(); const f=audioCtx.createBiquadFilter(); f.type='bandpass'; f.frequency.setValueAtTime(1200,t); const g=audioCtx.createGain(); g.gain.setValueAtTime(0.6,t); g.gain.exponentialRampToValueAtTime(0.01,t+0.18); const c=getChGain('snare',t); n.connect(f); f.connect(g); g.connect(c); c.connect(mainGainNode); const o=audioCtx.createOscillator(),og=audioCtx.createGain(); o.type='triangle'; o.frequency.setValueAtTime(170,t); o.frequency.exponentialRampToValueAtTime(0.01,t+0.08); og.gain.setValueAtTime(0.7,t); og.gain.exponentialRampToValueAtTime(0.01,t+0.08); o.connect(og); og.connect(c); n.start(t); n.stop(t+0.2); o.start(t); o.stop(t+0.1); }

function playHihat(t){ if(!audioCtx) initAudio(); const s=audioCtx.createBufferSource(); s.buffer=noiseBuf(); const f=audioCtx.createBiquadFilter(); f.type='highpass'; f.frequency.setValueAtTime(8000,t); const g=audioCtx.createGain(); g.gain.setValueAtTime(0.25,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.04); const c=getChGain('hihat',t); s.connect(f); f.connect(g); g.connect(c); c.connect(mainGainNode); s.start(t); s.stop(t+0.05); }

function playClap(t){ if(!audioCtx) initAudio(); const s=audioCtx.createBufferSource(); s.buffer=noiseBuf(); const f=audioCtx.createBiquadFilter(); f.type='bandpass'; f.frequency.setValueAtTime(1300,t); const g=audioCtx.createGain(); g.gain.setValueAtTime(0.5,t); g.gain.exponentialRampToValueAtTime(0.01,t+0.02); g.gain.setValueAtTime(0.4,t+0.025); g.gain.exponentialRampToValueAtTime(0.01,t+0.045); g.gain.setValueAtTime(0.6,t+0.05); g.gain.exponentialRampToValueAtTime(0.001,t+0.16); const c=getChGain('clap',t); s.connect(f); f.connect(g); g.connect(c); c.connect(mainGainNode); s.start(t); s.stop(t+0.2); }

function playTom(t){ if(!audioCtx) initAudio(); const o=audioCtx.createOscillator(),g=audioCtx.createGain(),c=getChGain('tom',t); o.type='sine'; o.frequency.setValueAtTime(110,t); o.frequency.exponentialRampToValueAtTime(45,t+0.22); g.gain.setValueAtTime(0.9,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.22); o.connect(g); g.connect(c); c.connect(mainGainNode); o.start(t); o.stop(t+0.25); }

function playFX(t){ if(!audioCtx) initAudio(); const o=audioCtx.createOscillator(),g=audioCtx.createGain(),c=getChGain('fx',t),f=audioCtx.createBiquadFilter(); o.type='sawtooth'; o.frequency.setValueAtTime(800,t); o.frequency.exponentialRampToValueAtTime(80,t+0.12); f.type='bandpass'; f.frequency.setValueAtTime(600,t); f.Q.setValueAtTime(8,t); g.gain.setValueAtTime(0.5,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.12); o.connect(f); f.connect(g); g.connect(c); c.connect(mainGainNode); o.start(t); o.stop(t+0.15); }

function playSynthNote(freq){
  if(!audioCtx) initAudio();
  if(audioCtx.state==='suspended') audioCtx.resume();
  const o=audioCtx.createOscillator(), g=audioCtx.createGain(), flt=audioCtx.createBiquadFilter();
  const type=document.getElementById('waveform').value, cutoff=parseFloat(document.getElementById('filter').value), decay=parseFloat(document.getElementById('synth-decay').value);
  o.type=type; o.frequency.setValueAtTime(freq, audioCtx.currentTime);
  flt.type='lowpass'; flt.frequency.setValueAtTime(cutoff, audioCtx.currentTime); flt.Q.setValueAtTime(2, audioCtx.currentTime);
  flt.frequency.exponentialRampToValueAtTime(cutoff*0.3, audioCtx.currentTime+decay);
  g.gain.setValueAtTime(0.4, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+decay);
  o.connect(flt); flt.connect(g); g.connect(mainGainNode); g.connect(delayNode);
  o.start(); o.stop(audioCtx.currentTime+decay+0.1);
  if(currentTutStep===4) completeTutorialStep();
}

function triggerPlay(inst){
  if(!audioCtx) initAudio();
  if(audioCtx.state==='suspended') audioCtx.resume();
  const t=audioCtx.currentTime;
  ({kick:playKick,snare:playSnare,hihat:playHihat,clap:playClap,tom:playTom,fx:playFX})[inst](t);
}

// ── Sequencer ──
let isPlaying=false, currentStep=0, tempo=120, timerId=null, nextNoteTime=0;

function nextStepFn(){ nextNoteTime += (60/tempo)/4; currentStep = (currentStep+1)%16; }

function scheduleNote(step,time){
  document.querySelectorAll('.seq-row').forEach(r=>{
    const inst=r.dataset.inst, btn=r.querySelector(`[data-step="${step}"]`);
    if(btn&&btn.classList.contains('active')) ({kick:playKick,snare:playSnare,hihat:playHihat,clap:playClap,tom:playTom,fx:playFX})[inst](time);
  });
  setTimeout(()=>{
    document.querySelectorAll('.step').forEach(b=>b.classList.remove('current'));
    document.querySelectorAll(`[data-step="${step}"]`).forEach(b=>b.classList.add('current'));
  }, (time-audioCtx.currentTime)*1000);
}

function scheduler(){ while(nextNoteTime<audioCtx.currentTime+0.1){ scheduleNote(currentStep,nextNoteTime); nextStepFn(); } timerId=setTimeout(scheduler,25); }

function startSeq(){
  initAudio(); if(audioCtx.state==='suspended') audioCtx.resume();
  isPlaying=true; currentStep=0; nextNoteTime=audioCtx.currentTime+0.05;
  document.getElementById('play-btn').innerHTML='<svg viewBox="0 0 24 24" fill="currentColor" width="12" height="12"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg> Stop';
  document.getElementById('play-btn').classList.add('playing');
  scheduler();
  if(currentTutStep===1) completeTutorialStep();
}

function stopSeq(){
  isPlaying=false; clearTimeout(timerId);
  document.getElementById('play-btn').innerHTML='<svg viewBox="0 0 24 24" fill="currentColor" width="12" height="12"><path d="M8 5v14l11-7z"/></svg> Play';
  document.getElementById('play-btn').classList.remove('playing');
  document.querySelectorAll('.step').forEach(b=>b.classList.remove('current'));
}

// ── Events ──
document.getElementById('play-btn').addEventListener('click',()=>{ isPlaying ? stopSeq() : startSeq(); });
document.getElementById('tempo').addEventListener('input',e=>{ tempo=parseInt(e.target.value); document.getElementById('bpm-val').innerText=tempo; });

document.querySelectorAll('.step').forEach(btn=>{
  btn.addEventListener('click',()=>{
    btn.classList.toggle('active');
    if(btn.classList.contains('active')) triggerPlay(btn.closest('.seq-row').dataset.inst);
    if(currentTutStep===2){
      const n=document.querySelectorAll('.step.active').length;
      if(n>=3) completeTutorialStep();
      else document.getElementById('tut-badge').innerText=`${n} / 3 selected`;
    }
  });
});

const pianoKeys=document.querySelectorAll('.key');
pianoKeys.forEach(k=>{
  k.addEventListener('mousedown',()=>{ playSynthNote(parseFloat(k.dataset.note)); k.classList.add('active'); });
  k.addEventListener('mouseup',()=>k.classList.remove('active'));
  k.addEventListener('mouseleave',()=>k.classList.remove('active'));
  k.addEventListener('touchstart',e=>{ e.preventDefault(); playSynthNote(parseFloat(k.dataset.note)); k.classList.add('active'); });
  k.addEventListener('touchend',()=>k.classList.remove('active'));
});

const keyMap={a:0,s:1,d:2,f:3,g:4,h:5,j:6,k:7};
window.addEventListener('keydown',e=>{
  if(e.repeat) return;
  const i=keyMap[e.key.toLowerCase()];
  if(i!==undefined){ playSynthNote(parseFloat(pianoKeys[i].dataset.note)); pianoKeys[i].classList.add('active'); }
});
window.addEventListener('keyup',e=>{
  const i=keyMap[e.key.toLowerCase()];
  if(i!==undefined) pianoKeys[i].classList.remove('active');
});

// ── Visualizer ──
const canvas=document.getElementById('visualizer'), vctx=canvas.getContext('2d');
function resizeCanvas(){ canvas.width=canvas.parentElement.clientWidth*devicePixelRatio; canvas.height=canvas.parentElement.clientHeight*devicePixelRatio; vctx.scale(devicePixelRatio,devicePixelRatio); }
window.addEventListener('resize',resizeCanvas); resizeCanvas();

function startVisualizer(){
  const buf=analyserNode.frequencyBinCount, data=new Uint8Array(buf);
  (function draw(){
    requestAnimationFrame(draw);
    const w=canvas.width/devicePixelRatio, h=canvas.height/devicePixelRatio;
    analyserNode.getByteTimeDomainData(data);
    vctx.fillStyle='rgba(6,8,14,0.3)'; vctx.fillRect(0,0,w,h);
    vctx.lineWidth=1.5; vctx.strokeStyle='rgba(59,130,246,0.5)';
    vctx.beginPath();
    const sl=w/buf; let x=0;
    for(let i=0;i<buf;i++){ const y=(data[i]/128)*h/2; i===0?vctx.moveTo(x,y):vctx.lineTo(x,y); x+=sl; }
    vctx.lineTo(w,h/2); vctx.stroke();
  })();
}

// static line
(()=>{ const w=canvas.width/devicePixelRatio,h=canvas.height/devicePixelRatio; vctx.fillStyle='#06080e'; vctx.fillRect(0,0,w,h); vctx.strokeStyle='rgba(255,255,255,0.04)'; vctx.lineWidth=1; vctx.beginPath(); vctx.moveTo(0,h/2); vctx.lineTo(w,h/2); vctx.stroke(); })();

// ── Tutorial ──
let currentTutStep=-1, isStepDone=false;
const steps=[
  { title:"Welcome to Neon Wave", text:"This quick guide walks you through the studio. Each step asks you to try something — learn by doing.", desc:"You can skip this anytime.", badge:"Get Started", focus:null, btn:"Let's go", req:false },
  { title:"Step 1 — Start the beat", text:"Hit the <b>Play</b> button in the top-right corner to start the sequencer loop.", desc:"Press the Play button to continue.", badge:"Action required", focus:"#tut-header", btn:"Waiting for Play...", req:true },
  { title:"Step 2 — Build a rhythm", text:"Click at least <b>3 squares</b> in the grid to activate them. Each lit square triggers its row's drum sound on that beat.", desc:"Select 3 or more squares in the grid.", badge:"0 / 3 selected", focus:"#tut-sequencer", btn:"Waiting...", req:true },
  { title:"Step 3 — Use the mixer", text:"Each channel has a volume slider and a <b>Mute (M)</b> button. Try adjusting the Kick channel's volume or muting it.", desc:"Move a volume slider or press M to continue.", badge:"Action required", focus:"#tut-mixer-kick", btn:"Waiting...", req:true },
  { title:"Step 4 — Play a note", text:"Click a piano key below, or press <b>A S D F G H J K</b> on your keyboard to play a synth note.", desc:"Play any note to finish the tour.", badge:"Action required", focus:"#tut-synth", btn:"Waiting...", req:true }
];

const overlay=document.getElementById('tutorial-overlay'), tTitle=document.getElementById('tut-title'), tText=document.getElementById('tut-text'), tDesc=document.getElementById('tut-desc'), tBadge=document.getElementById('tut-badge'), tNext=document.getElementById('tut-btn-next'), tSkip=document.getElementById('tut-btn-skip');

function startTutorial(force){
  if(!force && localStorage.getItem('tutDone')==='1') return;
  currentTutStep=0; showStep(0); overlay.style.display='flex';
}

function showStep(i){
  document.querySelectorAll('.tut-highlight').forEach(e=>e.classList.remove('tut-highlight'));
  const s=steps[i];
  tTitle.innerHTML=s.title; tText.innerHTML=s.text; tDesc.innerHTML=s.desc;
  tBadge.className='tut-badge'; tBadge.innerText=s.badge;
  tNext.innerHTML=s.btn; isStepDone=!s.req; tNext.disabled=s.req;
  if(s.focus){ const el=document.querySelector(s.focus); if(el){ el.classList.add('tut-highlight'); el.scrollIntoView({behavior:'smooth',block:'center'}); } }
}

function completeTutorialStep(){
  if(isStepDone) return; isStepDone=true; tNext.disabled=false;
  tBadge.className='tut-badge done'; tBadge.innerText='Done';
  const msgs=['','Beat is running.','Rhythm created.','Mixer adjusted.','Note played — you\'re all set.'];
  tText.innerHTML=`<b>${msgs[currentTutStep]}</b> Continue to the next step.`;
  tNext.innerHTML = currentTutStep===4 ? 'Finish' : 'Continue';
}

tNext.addEventListener('click',()=>{ currentTutStep++; currentTutStep<steps.length ? showStep(currentTutStep) : closeTut(); });
tSkip.addEventListener('click', closeTut);

function closeTut(){
  document.querySelectorAll('.tut-highlight').forEach(e=>e.classList.remove('tut-highlight'));
  overlay.style.display='none'; localStorage.setItem('tutDone','1');
}

window.addEventListener('load',()=>setTimeout(()=>startTutorial(false),800));
</script>
</body>
